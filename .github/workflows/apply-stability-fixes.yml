name: Apply stability fixes

on:
  push:
    branches:
      - stabilize-full-site-20260801
    paths:
      - .github/workflows/apply-stability-fixes.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize-full-site-20260801
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply code and deployment improvements
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/Http/Controllers/Admin/SitePageController.php')
          text = path.read_text()
          text = text.replace(
              'use App\\Services\\SiteContentService;\n',
              'use App\\Services\\SiteContentService;\nuse App\\Services\\SiteHtmlSanitizer;\n',
          )
          text = text.replace(
              'class SitePageController extends Controller\n{\n    private const BLOCK_TYPES',
              'class SitePageController extends Controller\n{\n    public function __construct(private readonly SiteHtmlSanitizer $htmlSanitizer) {}\n\n    private const BLOCK_TYPES',
          )
          old = '''    private function sanitizeHtml(string $html): string
              {
                  $html = preg_replace('#<(script|style|iframe|object|embed)[^>]*>.*?</\\1>#is', '', $html) ?? '';
                  $html = preg_replace('/\\son\\w+\\s*=\\s*("[^"]*"|\\'[^\\']*\\'|[^\\s>]+)/i', '', $html) ?? '';
                  $html = preg_replace('/javascript\\s*:/i', '', $html) ?? '';

                  return strip_tags($html, '<p><br><strong><b><em><i><u><s><ul><ol><li><blockquote><a><h2><h3><h4><table><thead><tbody><tr><th><td><span>');
              }
          '''
          old = '\n'.join(line[4:] if line.startswith('    ') else line for line in old.splitlines()) + '\n'
          new = '''    private function sanitizeHtml(string $html): string
              {
                  return $this->htmlSanitizer->sanitize($html);
              }
          '''
          new = '\n'.join(line[4:] if line.startswith('    ') else line for line in new.splitlines()) + '\n'
          if old not in text:
              raise SystemExit('sanitizeHtml block not found')
          text = text.replace(old, new)
          path.write_text(text)

          path = Path('config/logging.php')
          text = path.read_text().replace(
              "'channels' => explode(',', (string) env('LOG_STACK', 'single'))",
              "'channels' => explode(',', (string) env('LOG_STACK', 'daily'))",
          )
          path.write_text(text)

          path = Path('.env.example')
          text = path.read_text()
          text = text.replace('LOG_STACK=single\n', 'LOG_STACK=daily\nLOG_DAILY_DAYS=14\n')
          text = text.replace(
              'SESSION_DOMAIN=null\n',
              'SESSION_DOMAIN=null\nSESSION_SECURE_COOKIE=true\nSESSION_HTTP_ONLY=true\nSESSION_SAME_SITE=lax\n',
          )
          path.write_text(text)

          path = Path('.github/workflows/tests.yml')
          text = path.read_text().replace('permissions:\n  contents: write', 'permissions:\n  contents: read')
          path.write_text(text)
          PY

          cat > app/Http/Controllers/Admin/DashboardController.php <<'PHP'
          <?php

          namespace App\Http\Controllers\Admin;

          use App\Http\Controllers\Controller;
          use App\Models\Source;
          use Illuminate\Support\Collection;
          use Illuminate\View\View;

          class DashboardController extends Controller
          {
              public function __invoke(): View
              {
                  $sources = Source::query()
                      ->with('technicalAccount:id,status,is_active')
                      ->get()
                      ->groupBy('type');

                  return view('admin.dashboard', [
                      'sourceHealth' => [
                          $this->healthFor($sources->get(Source::TYPE_NEWS, collect()), 'Новости'),
                          $this->healthFor($sources->get(Source::TYPE_AIR_ALERT, collect()), 'Воздушные тревоги'),
                      ],
                  ]);
              }

              private function healthFor(Collection $sources, string $label): array
              {
                  if ($sources->isEmpty()) {
                      return [
                          'label' => $label,
                          'state' => 'missing',
                          'status' => 'Не настроено',
                          'description' => 'Источник ещё не добавлен.',
                          'last_success_at' => null,
                      ];
                  }

                  $active = $sources->where('is_active', true)->values();
                  if ($active->isEmpty()) {
                      return [
                          'label' => $label,
                          'state' => 'disabled',
                          'status' => 'Отключено',
                          'description' => 'Все источники этого типа выключены.',
                          'last_success_at' => $sources->max('last_success_at'),
                      ];
                  }

                  $hasConnectionProblem = $active->contains(function (Source $source): bool {
                      return ! $source->technicalAccount
                          || ! $source->technicalAccount->is_active
                          || $source->technicalAccount->status !== 'connected';
                  });
                  $hasSourceError = $active->contains(fn (Source $source): bool => filled($source->last_error));
                  $hasStaleSource = $active->contains(function (Source $source): bool {
                      if (! $source->last_success_at) {
                          return true;
                      }

                      $seconds = match ($source->check_interval_unit) {
                          'minutes' => $source->check_interval * 60,
                          'hours' => $source->check_interval * 3600,
                          default => $source->check_interval,
                      };

                      return $source->last_success_at->lt(now()->subSeconds(max(300, $seconds * 3)));
                  });

                  $latestSuccess = $active
                      ->filter(fn (Source $source): bool => $source->last_success_at !== null)
                      ->max('last_success_at');

                  if ($hasConnectionProblem || $hasSourceError) {
                      return [
                          'label' => $label,
                          'state' => 'critical',
                          'status' => 'Требует внимания',
                          'description' => $hasSourceError
                              ? 'У одного из источников сохранена ошибка обработки.'
                              : 'Технический аккаунт не подключён или отключён.',
                          'last_success_at' => $latestSuccess,
                      ];
                  }

                  if ($hasStaleSource) {
                      return [
                          'label' => $label,
                          'state' => 'warning',
                          'status' => 'Проверка задерживается',
                          'description' => 'Последняя успешная обработка была позже ожидаемого.',
                          'last_success_at' => $latestSuccess,
                      ];
                  }

                  return [
                      'label' => $label,
                      'state' => 'healthy',
                      'status' => 'Работает',
                      'description' => $active->count() === 1
                          ? 'Источник активен и обрабатывается планировщиком.'
                          : 'Активные источники обрабатываются планировщиком.',
                      'last_success_at' => $latestSuccess,
                  ];
              }
          }
