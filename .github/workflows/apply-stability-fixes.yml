          cat > deploy/backup/skyguardian-full-backup.sh <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          APP_DIR="/var/www/skyguardian"
          BACKUP_ROOT="/var/backups/skyguardian"
          CONFIG_FILE="/etc/skyguardian/backup.env"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          WORK_DIR="$BACKUP_ROOT/.work-$STAMP-$RANDOM"
          STAGE_DIR="$WORK_DIR/stage"
          FINAL_ARCHIVE="$BACKUP_ROOT/skyguardian-full-$STAMP.tar.gz"
          DB_CNF="$WORK_DIR/mysql-client.cnf"
          DB_NAME_FILE="$WORK_DIR/database-name.txt"

          mkdir -p "$BACKUP_ROOT" "$STAGE_DIR"
          chmod 700 "$BACKUP_ROOT"

          cleanup() {
              rm -f "$DB_CNF" "$DB_NAME_FILE"
              rm -rf "$WORK_DIR"
          }
          trap cleanup EXIT

          test -f "$APP_DIR/.env"
          test -f "$APP_DIR/artisan"
          cd "$APP_DIR"

          php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $connection = (string) config("database.default");
              $cfg = (array) config("database.connections.".$connection);
              if (!in_array($connection, ["mysql", "mariadb"], true)) exit(2);
              $escape = static fn ($value): string => str_replace(["\\", "\n", "\r"], ["\\\\", "", ""], (string) $value);
              file_put_contents($argv[1], implode(PHP_EOL, [
                  "[client]",
                  "host=".$escape($cfg["host"] ?? "127.0.0.1"),
                  "port=".$escape($cfg["port"] ?? "3306"),
                  "user=".$escape($cfg["username"] ?? ""),
                  "password=".$escape($cfg["password"] ?? ""),
                  "default-character-set=utf8mb4",
              ]).PHP_EOL);
              chmod($argv[1], 0600);
              file_put_contents($argv[2], (string) ($cfg["database"] ?? ""));
          ' "$DB_CNF" "$DB_NAME_FILE"

          DB_NAME="$(cat "$DB_NAME_FILE")"
          test -n "$DB_NAME"

          nice -n 10 ionice -c2 -n7 mysqldump \
              --defaults-extra-file="$DB_CNF" \
              --single-transaction --quick --routines --events --triggers --hex-blob \
              --default-character-set=utf8mb4 "$DB_NAME" | gzip -1 > "$STAGE_DIR/database.sql.gz"

          rm -f "$DB_CNF" "$DB_NAME_FILE"

          set +e
          nice -n 10 ionice -c2 -n7 tar --warning=no-file-changed --ignore-failed-read \
              -czf "$STAGE_DIR/application.tar.gz" -C /var/www skyguardian
          APP_STATUS=$?
          set -e
          [ "$APP_STATUS" -le 1 ]

          CONFIG_PATHS=(etc/nginx etc/letsencrypt etc/mysql etc/php/8.3/fpm/pool.d)
          for service in /etc/systemd/system/skyguardian*.service /etc/systemd/system/skyguardian*.timer; do
              [ -e "$service" ] && CONFIG_PATHS+=("${service#/}")
          done
          nice -n 10 ionice -c2 -n7 tar --ignore-failed-read \
              -czf "$STAGE_DIR/server-config.tar.gz" -C / "${CONFIG_PATHS[@]}"

          crontab -l > "$STAGE_DIR/root-crontab.txt" 2>/dev/null || true
          systemctl list-units 'skyguardian*' --all --no-pager > "$STAGE_DIR/systemd-status.txt" 2>/dev/null || true
          printf 'created_utc=%s\napp_dir=%s\n' "$STAMP" "$APP_DIR" > "$STAGE_DIR/MANIFEST.txt"

          (
              cd "$STAGE_DIR"
              sha256sum database.sql.gz application.tar.gz server-config.tar.gz > SHA256SUMS
          )
          tar -czf "$FINAL_ARCHIVE" -C "$STAGE_DIR" .
          tar -tzf "$FINAL_ARCHIVE" >/dev/null
          chmod 600 "$FINAL_ARCHIVE"

          mapfile -t BACKUPS < <(find "$BACKUP_ROOT" -maxdepth 1 -type f -name 'skyguardian-full-*.tar.gz' -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
          if [ "${#BACKUPS[@]}" -gt 14 ]; then
              printf '%s\0' "${BACKUPS[@]:14}" | xargs -0r rm -f
          fi

          if [ -f "$CONFIG_FILE" ]; then
              # shellcheck disable=SC1090
              source "$CONFIG_FILE"
          fi

          if [ -n "${RCLONE_REMOTE:-}" ]; then
              KEY_FILE="${BACKUP_ENCRYPTION_PASSWORD_FILE:-/etc/skyguardian/backup.key}"
              test -s "$KEY_FILE"
              command -v rclone >/dev/null
              ENCRYPTED="$FINAL_ARCHIVE.enc"
              openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
                  -in "$FINAL_ARCHIVE" -out "$ENCRYPTED" -pass "file:$KEY_FILE"
              rclone copyto "$ENCRYPTED" "${RCLONE_REMOTE%/}/$(basename "$ENCRYPTED")"
              rm -f "$ENCRYPTED"
          fi

          sha256sum "$FINAL_ARCHIVE"
          BASH
          chmod +x deploy/backup/skyguardian-full-backup.sh

          cat > deploy/systemd/skyguardian-backup.service <<'UNIT'
          [Unit]
          Description=SkyGuardian full backup
          After=mysql.service network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User=root
          Group=root
          WorkingDirectory=/var/www/skyguardian
          ExecStart=/usr/local/sbin/skyguardian-full-backup
          Nice=10
          IOSchedulingClass=best-effort
          IOSchedulingPriority=7
          PrivateTmp=true
          ProtectSystem=full
          ReadWritePaths=/var/backups/skyguardian /var/www/skyguardian /etc/skyguardian
          UNIT

          cat > deploy/systemd/skyguardian-backup.timer <<'UNIT'
          [Unit]
          Description=Daily SkyGuardian full backup

          [Timer]
          OnCalendar=*-*-* 03:30:00
          RandomizedDelaySec=15m
          Persistent=true
          Unit=skyguardian-backup.service

          [Install]
          WantedBy=timers.target
          UNIT

          cat > .github/dependabot.yml <<'YAML'
          version: 2
          updates:
            - package-ecosystem: composer
              directory: /
              schedule:
                interval: weekly
              open-pull-requests-limit: 5
            - package-ecosystem: npm
              directory: /
              schedule:
                interval: weekly
              open-pull-requests-limit: 5
          YAML

          cat > .github/workflows/deploy.yml <<'YAML'
          name: Deploy SkyGuardian

          on:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: write

          jobs:
            deploy:
              name: Deploy to VPS
              runs-on: self-hosted
              timeout-minutes: 30
              env:
                BEFORE_SHA: ${{ github.event.before }}

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 2

                - name: Deploy Laravel application
                  shell: bash
                  run: |
                    set -Eeuo pipefail

                    sudo mkdir -p /var/www/skyguardian
                    sudo rsync -a --delete \
                      --exclude=".git" \
                      --exclude=".github" \
                      --exclude=".env" \
                      --exclude=".venv" \
                      --exclude="node_modules" \
                      --exclude="vendor" \
                      "$GITHUB_WORKSPACE/" /var/www/skyguardian/

                    cd /var/www/skyguardian
                    sudo mkdir -p \
                      storage/framework/cache \
                      storage/framework/sessions \
                      storage/framework/views \
                      storage/logs/archive \
                      bootstrap/cache
                    sudo chown -R github-runner:www-data /var/www/skyguardian
                    sudo chmod -R ug+rwX storage bootstrap/cache
                    sudo touch storage/logs/laravel.log
                    sudo chown github-runner:www-data storage/logs/laravel.log
                    sudo chmod 664 storage/logs/laravel.log

                    composer install \
                      --no-dev \
                      --no-interaction \
                      --prefer-dist \
                      --optimize-autoloader

                    if [ ! -d .venv ]; then
                      python3 -m venv .venv
                    fi
                    .venv/bin/pip install --disable-pip-version-check -r telethon/requirements.txt

                    npm ci --no-audit --no-fund
                    npm run build

                    if [ ! -f .env ]; then
                      cp .env.example .env
                    fi
                    if ! grep -Eq '^APP_KEY=base64:.+' .env; then
                      php artisan key:generate --force
                    fi

                    upsert_env() {
                      local key="$1" value="$2"
                      if grep -qE "^${key}=" .env; then
                        sed -i "s#^${key}=.*#${key}=${value}#" .env
                      else
                        printf '%s=%s\n' "$key" "$value" >> .env
                      fi
                    }
                    upsert_env LOG_CHANNEL stack
                    upsert_env LOG_STACK daily
                    upsert_env LOG_DAILY_DAYS 14
                    upsert_env LOG_LEVEL info
                    upsert_env SESSION_SECURE_COOKIE true
                    upsert_env SESSION_HTTP_ONLY true
                    upsert_env SESSION_SAME_SITE lax

                    if [ -f storage/logs/laravel.log ] \
                      && [ "$(stat -c '%s' storage/logs/laravel.log)" -gt 10485760 ]; then
                      ARCHIVE="storage/logs/archive/laravel-before-daily-$(date -u +%Y%m%dT%H%M%SZ).log.gz"
                      sudo gzip -c storage/logs/laravel.log > "$ARCHIVE"
                      sudo truncate -s 0 storage/logs/laravel.log
                    fi

                    if [ -e public/storage ] && [ ! -L public/storage ]; then
                      rm -rf public/storage
                    fi
                    if [ ! -L public/storage ]; then
                      php artisan storage:link
                    fi

                    sudo chown -R www-data:www-data storage bootstrap/cache
                    sudo chmod -R ug+rwX storage bootstrap/cache
                    sudo -u www-data php artisan optimize:clear
                    sudo -u www-data php artisan migrate --force
                    sudo -u www-data php artisan config:cache
                    sudo -u www-data php artisan view:cache
                    sudo -u www-data php artisan schedule:list --no-ansi >/dev/null

                    sudo cp deploy/systemd/skyguardian-telethon.service /etc/systemd/system/skyguardian-telethon.service
                    sudo cp deploy/systemd/skyguardian-scheduler.service /etc/systemd/system/skyguardian-scheduler.service
                    sudo cp deploy/systemd/skyguardian-group-channel-telethon.service /etc/systemd/system/skyguardian-group-channel-telethon.service
                    sudo cp deploy/systemd/skyguardian-group-channel-delete.service /etc/systemd/system/skyguardian-group-channel-delete.service
                    sudo cp deploy/systemd/skyguardian-backup.service /etc/systemd/system/skyguardian-backup.service
                    sudo cp deploy/systemd/skyguardian-backup.timer /etc/systemd/system/skyguardian-backup.timer
                    sudo cp deploy/backup/skyguardian-full-backup.sh /usr/local/sbin/skyguardian-full-backup
                    sudo chmod 750 /usr/local/sbin/skyguardian-full-backup
                    sudo mkdir -p /etc/skyguardian
                    if [ ! -f /etc/skyguardian/backup.key ]; then
                      sudo sh -c 'umask 077; openssl rand -base64 48 > /etc/skyguardian/backup.key'
                    fi
                    if [ ! -f /etc/skyguardian/backup.env ]; then
                      printf '%s\n' \
                        '# Optional encrypted offsite backup using rclone.' \
                        '# Example: RCLONE_REMOTE=remote:skyguardian-backups' \
                        'RCLONE_REMOTE=' \
                        'BACKUP_ENCRYPTION_PASSWORD_FILE=/etc/skyguardian/backup.key' \
                        | sudo tee /etc/skyguardian/backup.env >/dev/null
                      sudo chmod 600 /etc/skyguardian/backup.env
                    fi

                    sudo systemctl daemon-reload
                    sudo systemctl enable \
                      skyguardian-telethon.service \
                      skyguardian-scheduler.service \
                      skyguardian-group-channel-telethon.service \
                      skyguardian-group-channel-delete.service \
                      skyguardian-backup.timer

                    CORE_RESTART_REQUIRED=1
                    if [ -n "${BEFORE_SHA:-}" ] \
                      && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
                      && git -C "$GITHUB_WORKSPACE" cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                      CHANGED_FILES="$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
                      if [ -n "$CHANGED_FILES" ] \
                        && ! printf '%s\n' "$CHANGED_FILES" | grep -Ev '^(database/migrations/2026_07_27_120000_create_group_channel_technical_delete_tasks_table\.php|\.github/workflows/deploy\.yml)$' >/dev/null; then
                        CORE_RESTART_REQUIRED=0
                      fi
                    fi

                    if [ "$CORE_RESTART_REQUIRED" -eq 1 ]; then
                      sudo systemctl restart skyguardian-telethon.service skyguardian-scheduler.service
                    else
                      sudo systemctl is-active --quiet skyguardian-telethon.service || sudo systemctl start skyguardian-telethon.service
                      sudo systemctl is-active --quiet skyguardian-scheduler.service || sudo systemctl start skyguardian-scheduler.service
                    fi
                    sudo systemctl restart \
                      skyguardian-group-channel-telethon.service \
                      skyguardian-group-channel-delete.service
                    sudo systemctl start skyguardian-backup.timer

                    sudo systemctl reload php8.3-fpm
                    sudo nginx -t
                    sudo systemctl reload nginx
                    curl --fail --silent --show-error --max-time 15 https://skyguardian.pp.ua/up >/dev/null
                    test -L public/storage

                    sudo systemctl --no-pager --full status \
                      skyguardian-telethon.service \
                      skyguardian-scheduler.service \
                      skyguardian-group-channel-telethon.service \
                      skyguardian-group-channel-delete.service \
                      skyguardian-backup.timer
                    echo "SkyGuardian deployed successfully."

                - name: Mark deployed revision
                  shell: bash
                  run: |
                    git tag -f deployed "$GITHUB_SHA"
                    git push origin refs/tags/deployed --force
          YAML

      - name: Generate lock files and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          composer update ezyang/htmlpurifier --with-dependencies --no-interaction --prefer-dist --no-progress
          composer validate --strict
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build
          php artisan test
          vendor/bin/pint
          php artisan test
          composer audit --no-interaction
          npm audit --audit-level=high
          python3 -m py_compile telethon/worker.py telethon/group_channel_worker.py

      - name: Record validation and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > stability-fix-validation.txt <<RESULT
          status=success
          validated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          composer_validate=passed
          composer_audit=passed
          npm_ci=passed
          npm_audit=passed
          vite_build=passed
          php_tests=passed
          php_format=passed
          python_syntax=passed
          RESULT
          git rm .github/workflows/apply-stability-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Завершить стабилизацию и защиту сайта"
          git push origin HEAD:stabilize-full-site-20260801
