name: Update Guzzle lock

on:
  push:
    branches:
      - agent/api-alert-publications

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/api-alert-publications

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite
          coverage: none

      - name: Update Guzzle
        run: composer update guzzlehttp/guzzle --with-dependencies --no-interaction --no-progress

      - name: Commit lock file
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Обновить Guzzle до безопасной версии"
          git push origin HEAD:agent/api-alert-publications
