name: Build Ass Hunter APK

on:
  push:
    branches:
      - ass-hunter-apk-build
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install high-quality game assets
        run: |
          mkdir -p ass-hunter-android/app/src/main/res/drawable-nodpi
          mkdir -p ass-hunter-android/app/src/main/res/raw
          BASE="https://raw.githubusercontent.com/AllanDouglas/Watch-Out-Behind-You-Hunter-Unity3D/main/Assets/_Game"
          curl -L --fail "$BASE/Sprites/main_menu.png" -o ass-hunter-android/app/src/main/res/drawable-nodpi/main_menu.png
          curl -L --fail "$BASE/Sprites/Player.png" -o ass-hunter-android/app/src/main/res/drawable-nodpi/player.png
          curl -L --fail "$BASE/Sprites/Enemy.png" -o ass-hunter-android/app/src/main/res/drawable-nodpi/enemy.png
          curl -L --fail "$BASE/Sprites/Environment.png" -o ass-hunter-android/app/src/main/res/drawable-nodpi/environment.png
          curl -L --fail "$BASE/Sprites/Tiles.png" -o ass-hunter-android/app/src/main/res/drawable-nodpi/tiles.png
          curl -L --fail "$BASE/Sprites/UI.png" -o ass-hunter-android/app/src/main/res/drawable-nodpi/ui.png
          curl -L --fail "$BASE/Sprites/start_button.png" -o ass-hunter-android/app/src/main/res/drawable-nodpi/start_button.png
          curl -L --fail "$BASE/Sounds/shot.mp3" -o ass-hunter-android/app/src/main/res/raw/shot.mp3
          curl -L --fail "$BASE/Sounds/reload.mp3" -o ass-hunter-android/app/src/main/res/raw/reload.mp3
          curl -L --fail "$BASE/Sounds/hit.mp3" -o ass-hunter-android/app/src/main/res/raw/hit.mp3
          curl -L --fail "$BASE/Sounds/catch.mp3" -o ass-hunter-android/app/src/main/res/raw/catch_sound.mp3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ass-hunter-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy final APK
        run: cp ass-hunter-android/app/build/outputs/apk/debug/app-debug.apk AssHunter-HD.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssHunter-HD-APK
          path: AssHunter-HD.apk
          if-no-files-found: error
