name: Build Ass Hunter APK

on:
  push:
    branches:
      - ass-hunter-apk-build
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download high-quality art references
        run: |
          mkdir -p art-preview
          curl -L --fail "https://raw.githubusercontent.com/AllanDouglas/Watch-Out-Behind-You-Hunter-Unity3D/main/Assets/_Game/Sprites/main_menu.png" -o art-preview/main_menu.png
          curl -L --fail "https://raw.githubusercontent.com/AllanDouglas/Watch-Out-Behind-You-Hunter-Unity3D/main/Assets/_Game/Sprites/Player.png" -o art-preview/player.png
          curl -L --fail "https://raw.githubusercontent.com/AllanDouglas/Watch-Out-Behind-You-Hunter-Unity3D/main/Assets/_Game/Sprites/Enemy.png" -o art-preview/enemy.png
          curl -L --fail "https://raw.githubusercontent.com/AllanDouglas/Watch-Out-Behind-You-Hunter-Unity3D/main/Assets/_Game/Sprites/Environment.png" -o art-preview/environment.png
          curl -L --fail "https://raw.githubusercontent.com/AllanDouglas/Watch-Out-Behind-You-Hunter-Unity3D/main/Assets/_Game/Sprites/Tiles.png" -o art-preview/tiles.png
          curl -L --fail "https://raw.githubusercontent.com/AllanDouglas/Watch-Out-Behind-You-Hunter-Unity3D/main/wobyh.png" -o art-preview/pc_reference.png

      - name: Upload art preview
        uses: actions/upload-artifact@v4
        with:
          name: AssHunter-Art-Preview
          path: art-preview
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ass-hunter-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy final APK
        run: cp ass-hunter-android/app/build/outputs/apk/debug/app-debug.apk AssHunter.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssHunter-APK
          path: AssHunter.apk
          if-no-files-found: error
