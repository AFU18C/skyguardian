name: Runner Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check SkyGuardian server
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify runner and installed software
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Runner name: ${RUNNER_NAME}"
          echo "Machine: $(hostname)"
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"

          php -v
          composer --version
          node --version
          npm --version
          mysql --version
          python3 --version

          /opt/skyguardian-telethon/venv/bin/python \
            -c "import telethon; print('Telethon:', telethon.__version__)"

          systemctl is-active nginx
          systemctl is-active mysql
          systemctl is-active php8.3-fpm

          echo "SkyGuardian runner check completed successfully."
