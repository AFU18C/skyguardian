name: Update Compact History Tests

on:
  push:
    branches:
      - fix/compact-alert-history-toggle

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/compact-alert-history-toggle
          fetch-depth: 0
      - name: Update tests
        run: python3 .github/scripts/update_compact_history_tests.py
      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Feature/GroupChannelAlertPublicationTest.php tests/Feature/GroupChannelAlertDirectTelegramTest.php
          git commit -m "Покрыть компактную историю отбоев тестами"
          git push origin HEAD:fix/compact-alert-history-toggle
