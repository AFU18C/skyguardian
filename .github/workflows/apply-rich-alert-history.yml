name: Apply Rich Alert History

on:
  push:
    branches:
      - feature/rich-private-alert-history
    paths:
      - .github/workflows/apply-rich-alert-history.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/rich-private-alert-history
      - name: Apply history changes
        run: python3 scripts/apply-rich-alert-history.py
      - name: Commit changes
        run: |
          git config user.name "AFU18C"
          git config user.email "bigxaos@gmail.com"
          git add app/Services/GroupChannelAlertHistoryService.php app/Services/GroupChannelAlertPublicationService.php app/Http/Controllers/GroupChannelWebhookController.php tests/Feature/GroupChannelAlertHistoryDeepLinkTest.php
          git diff --cached --quiet && exit 0
          git commit -m "Подключить полную личную историю тревоги"
          git push origin HEAD:feature/rich-private-alert-history
