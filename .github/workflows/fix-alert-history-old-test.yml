name: Fix Alert History Old Test

on:
  push:
    branches:
      - fix/alert-history-spoiler

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/alert-history-spoiler
          fetch-depth: 0
      - name: Update stale expectation
        run: python3 .github/scripts/fix_alert_history_old_test.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Feature/GroupChannelAlertPublicationTest.php
          git commit -m "Обновить тест частичного отбоя с историей"
          git push origin HEAD:fix/alert-history-spoiler
