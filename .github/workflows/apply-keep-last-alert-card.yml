name: Apply Keep Last Alert Card

on:
  push:
    branches:
      - fix/keep-last-alert-card-on-clear

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/keep-last-alert-card-on-clear
          fetch-depth: 0
      - name: Apply change
        run: python3 .github/scripts/apply_keep_last_alert_card.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/GroupChannelAlertPublicationService.php tests/Feature/GroupChannelAlertPublicationTest.php tests/Feature/GroupChannelAlertAllClearFormatTest.php
          git commit -m "Оставлять последнюю красную карточку после отбоя"
          git push origin HEAD:fix/keep-last-alert-card-on-clear
