name: Format Compact Alert History

on:
  push:
    branches:
      - fix/compact-alert-history-toggle

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/compact-alert-history-toggle
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint app/Services/DirectGroupChannelTelegramService.php app/Services/GroupChannelAlertPublicationService.php
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/DirectGroupChannelTelegramService.php app/Services/GroupChannelAlertPublicationService.php
          git commit -m "Отформатировать компактную историю отбоев"
          git push origin HEAD:fix/compact-alert-history-toggle
