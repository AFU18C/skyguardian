name: Diagnose Production CPU

on:
  push:
    branches:
      - ops/diagnose-cpu-20260804

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Collect concise CPU diagnosis
        shell: bash
        run: |
          set -u
          report=/tmp/skyguardian-cpu-summary.txt
          exec > >(tee "$report") 2>&1

          echo '=== current ==='
          date --iso-8601=seconds
          echo "logical_cpus=$(nproc)"
          echo "loadavg=$(cat /proc/loadavg)"
          free -h

          echo '=== cpu average over 10 seconds ==='
          if command -v mpstat >/dev/null 2>&1; then
            mpstat 1 10 | awk '/Average:/ && $2 == "all" {print}' || true
          else
            vmstat 1 11 | tail -n 10 || true
          fi

          echo '=== current top production processes ==='
          ps -eo pid,user,pcpu,pmem,etime,comm,args --sort=-pcpu \
            | grep -v -E 'Runner.Worker|diagnose-cpu|mpstat|vmstat|awk|grep' \
            | head -n 12 \
            | sed -E 's#(bot|token|password|secret|key)=([^ ]+)#\1=[REDACTED]#gi' || true

          echo '=== scheduler command timings over last 180 seconds ==='
          sudo journalctl -u skyguardian-scheduler.service --since '180 seconds ago' \
            --no-pager -o cat > /tmp/skyguardian-scheduler-journal.txt 2>/dev/null || true
          python3 - <<'PY'
          import re
          from collections import defaultdict
          from pathlib import Path

          stats = defaultdict(list)
          pattern = re.compile(r"Running \['artisan'\s+([^\]]+?)\]\s+([0-9.]+)(ms|s)\s+DONE")
          path = Path('/tmp/skyguardian-scheduler-journal.txt')

          if path.exists():
              for line in path.read_text(errors='replace').splitlines():
                  match = pattern.search(line)
                  if match:
                      value = float(match.group(2))
                      ms = value * 1000 if match.group(3) == 's' else value
                      stats[match.group(1).strip()].append(ms)

          print(f"{'command':68} {'runs':>5} {'avg_ms':>9} {'max_ms':>9} {'wall_%':>8}")
          for command, values in sorted(stats.items(), key=lambda item: sum(item[1]), reverse=True):
              total = sum(values)
              print(f"{command[:68]:68} {len(values):5d} {total/len(values):9.1f} {max(values):9.1f} {total/180000*100:7.2f}%")
          if not stats:
              print('no_timings_found')
          PY

          echo '=== service totals ==='
          for service in skyguardian-scheduler.service skyguardian-telethon.service php8.3-fpm.service nginx.service mysql.service; do
            if systemctl list-unit-files "$service" --no-legend 2>/dev/null | grep -q .; then
              echo "--- $service ---"
              sudo systemctl show "$service" --property=ActiveState,MainPID,MemoryCurrent,CPUUsageNSec,ExecMainStartTimestamp --no-pager || true
            fi
          done

          rm -f /tmp/skyguardian-scheduler-journal.txt

      - name: Publish concise report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/skyguardian-cpu-summary.txt';
            let report = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'CPU summary was not created.';
            report = report
              .replace(/https:\/\/api\.telegram\.org\/bot[^/\s]+/gi, 'https://api.telegram.org/bot[REDACTED]')
              .replace(/\b\d{6,15}:[A-Za-z0-9_-]{20,}\b/g, '[TELEGRAM_BOT_TOKEN_REDACTED]')
              .replace(/(token|password|secret|key)=([^\s]+)/gi, '$1=[REDACTED]');

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 62,
              body: `Краткая диагностика production.\n\n\`\`\`text\n${report}\n\`\`\``,
            });
