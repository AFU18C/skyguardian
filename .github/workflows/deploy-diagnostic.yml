name: Verify technical delete deployment

on:
  push:
    branches:
      - deploy-diagnostic-technical-delete

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Verify production without restarting services
        shell: bash
        run: |
          set +e
          {
            set -Eeuo pipefail
            echo "timestamp=$(date -Is)"
            echo
            echo "== existing production services =="
            echo "telethon=$(sudo systemctl is-active skyguardian-telethon.service)"
            echo "scheduler=$(sudo systemctl is-active skyguardian-scheduler.service)"
            echo
            echo "== isolated group-channel services =="
            echo "group_channel_telethon=$(sudo systemctl is-active skyguardian-group-channel-telethon.service)"
            echo "group_channel_delete=$(sudo systemctl is-active skyguardian-group-channel-delete.service)"

            PORT_READY=0
            for attempt in $(seq 1 20); do
              if sudo ss -ltnp | grep -q ':8788'; then
                PORT_READY=1
                break
              fi
              sleep 0.5
            done
            [ "$PORT_READY" -eq 1 ]
            echo "port_8788=listening"

            cd /var/www/skyguardian
            php artisan migrate:status | grep '2026_07_27_120000' | grep 'Ran'
            echo "migration=ran"
            php artisan list | grep 'group-channel-technical-delete'
            echo "artisan_worker=registered"
            .venv/bin/python -m py_compile telethon/group_channel_worker.py
            echo "python_worker=valid"

            MAIN_SHA="$(git ls-remote https://github.com/AFU18C/skyguardian.git refs/heads/main | cut -f1)"
            DEPLOYED_SHA="$(git ls-remote https://github.com/AFU18C/skyguardian.git refs/tags/deployed | cut -f1)"
            echo "main_sha=$MAIN_SHA"
            echo "deployed_sha=$DEPLOYED_SHA"
            [ -n "$MAIN_SHA" ]
            [ "$MAIN_SHA" = "$DEPLOYED_SHA" ]
            echo "verification_status=success"
          } > deploy-diagnostic.txt 2>&1
          STATUS=$?
          echo "exit_code=$STATUS" >> deploy-diagnostic.txt
          exit "$STATUS"

      - name: Commit verification result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-diagnostic.txt
          git commit -m "Record final deployment verification" || exit 0
          git push origin HEAD:deploy-diagnostic-technical-delete
