name: Apply Compact Alert History Toggle

on:
  push:
    branches:
      - fix/compact-alert-history-toggle

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/compact-alert-history-toggle
          fetch-depth: 0
      - name: Apply change
        run: python3 .github/scripts/apply_compact_alert_history_toggle.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/GroupChannelAlertPublicationService.php app/Services/GroupChannelWebhookService.php app/Services/DirectGroupChannelTelegramService.php
          git commit -m "Сделать историю отбоев компактной и раскрываемой"
          git push origin HEAD:fix/compact-alert-history-toggle
