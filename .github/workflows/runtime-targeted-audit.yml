name: Runtime targeted audit

on:
  push:
    branches:
      - full-site-audit-20260801
    paths:
      - audit/runtime-targeted-audit.sh
      - .github/workflows/runtime-targeted-audit.yml

permissions:
  contents: write

jobs:
  audit:
    name: Source and login read-only audit
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run targeted audit
        shell: bash
        run: |
          chmod +x audit/runtime-targeted-audit.sh
          audit/runtime-targeted-audit.sh

      - name: Commit reports
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-targeted-audit.txt runtime-targeted-details.txt
          git commit -m "Record targeted runtime audit" || exit 0
          git push origin HEAD:full-site-audit-20260801
