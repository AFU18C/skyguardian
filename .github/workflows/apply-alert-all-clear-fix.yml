name: Apply Alert All Clear Fix

on:
  push:
    branches:
      - fix/alert-all-clear-template

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/alert-all-clear-template
          fetch-depth: 0
      - name: Finalize targeted changes
        run: python3 .github/scripts/finalize_alert_all_clear_fix.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Services/GroupChannelAlertPublicationService.php tests/Feature/GroupChannelAlertPublicationTest.php
          git commit -m "Разделить отбои по областям и повторять удаление карточек"
          git push origin HEAD:fix/alert-all-clear-template
