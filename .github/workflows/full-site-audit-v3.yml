name: Full site audit v3

on:
  push:
    branches:
      - full-site-audit-20260801
    paths:
      - audit/read-only-audit-v3.sh
      - .github/workflows/full-site-audit-v3.yml

permissions:
  contents: write

jobs:
  audit:
    name: Deep read-only production audit
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run deep audit without production changes
        shell: bash
        run: |
          chmod +x audit/read-only-audit-v3.sh
          audit/read-only-audit-v3.sh

      - name: Commit audit reports
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full-site-audit-v3-report.txt full-site-audit-v3-details.txt
          git commit -m "Record deep read-only site audit" || exit 0
          git push origin HEAD:full-site-audit-20260801
