name: SkyGuardian Tests

on:
  push:
    branches:
      - main
      - tz1-implementation
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP tests
        run: php artisan test

      - name: Generate Pint formatting patch
        run: |
          vendor/bin/pint
          git diff --binary > pint.patch

      - name: Upload Pint formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: pint-formatting-patch
          path: pint.patch
          if-no-files-found: error

      - name: Fail when formatting changes are required
        run: git diff --exit-code

      - name: Check Telethon worker syntax
        run: python3 -m py_compile telethon/worker.py
