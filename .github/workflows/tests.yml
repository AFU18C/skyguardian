name: SkyGuardian Tests

on:
  push:
    branches:
      - main
      - tz1-implementation
      - tz2-interface
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Run PHP tests
        run: php artisan test

      - name: Apply PHP formatting
        run: vendor/bin/pint

      - name: Check PHP formatting
        run: git diff --exit-code

      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Check Telethon worker syntax
        run: python3 -m py_compile telethon/worker.py telethon/group_channel_worker.py
