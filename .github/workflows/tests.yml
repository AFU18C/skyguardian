name: SkyGuardian Tests

on:
  push:
    branches:
      - main
      - tz1-implementation
      - tz2-interface
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Run PHP tests
        id: php-tests
        continue-on-error: true
        run: php artisan test > test-output.txt 2>&1

      - name: Upload PHP test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-test-output
          path: test-output.txt
          retention-days: 1

      - name: Fail when PHP tests fail
        if: steps.php-tests.outcome == 'failure'
        run: exit 1

      - name: Apply PHP formatting
        run: vendor/bin/pint

      - name: Commit PHP formatting
        if: github.event_name == 'push' && (github.ref == 'refs/heads/tz1-implementation' || github.ref == 'refs/heads/tz2-interface')
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --update
            git commit -m "Apply Pint formatting"
            git push
          fi

      - name: Check PHP formatting
        run: git diff --exit-code

      - name: Check Telethon worker syntax
        run: python3 -m py_compile telethon/worker.py
