name: SkyGuardian Campaign Status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/campaign-status.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Process due campaign posts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /var/www/skyguardian
          sudo -u www-data php artisan skyguardian:group-channel-publications:process --limit=20
          sudo -u www-data php artisan skyguardian:promo-campaign:status
          sudo -u www-data php artisan skyguardian:anti-casino-campaign:status

      - name: Publish campaign status to issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const promoPath = '/var/www/skyguardian/public/storage/skyguardian-campaign-status.json';
            const antiCasinoPath = '/var/www/skyguardian/public/storage/anti-casino-campaign-status.json';
            const marker = '<!-- skyguardian-campaign-status -->';

            if (!fs.existsSync(promoPath)) {
              core.setFailed(`Status file not found: ${promoPath}`);
              return;
            }

            if (!fs.existsSync(antiCasinoPath)) {
              core.setFailed(`Status file not found: ${antiCasinoPath}`);
              return;
            }

            const status = JSON.parse(fs.readFileSync(promoPath, 'utf8'));
            const antiCasino = JSON.parse(fs.readFileSync(antiCasinoPath, 'utf8'));
            const rows = (status.posts || []).map((post) => {
              const link = post.post_link ? `[Відкрити](${post.post_link})` : '—';
              const error = post.last_error ? String(post.last_error).replaceAll('|', '\\|') : '—';
              return `| ${post.number ?? '—'} | ${post.status ?? '—'} | ${post.scheduled_at ?? '—'} | ${post.sent_at ?? '—'} | ${link} | ${error} |`;
            });
            const counts = antiCasino.statuses || {};

            const body = [
              marker,
              '## Статус кампаний SkyGuardian',
              '',
              `Обновлено: ${antiCasino.generated_at ?? status.generated_at ?? new Date().toISOString()}`,
              '',
              '### Антиказино — 1000 фото-постов',
              '',
              `- Всего создано: **${antiCasino.total ?? 0}**`,
              `- Отправлено: **${counts.sent ?? 0}**`,
              `- В очереди: **${counts.scheduled ?? 0}**`,
              `- Ошибок: **${counts.error ?? 0}**`,
              `- Первый слот: **${antiCasino.first_scheduled_at ?? '—'}**`,
              `- Последний слот: **${antiCasino.last_scheduled_at ?? '—'}**`,
              `- Последняя отправка: **${antiCasino.latest_sent_at ?? '—'}**`,
              '',
              '### Первая промо-кампания',
              '',
              '| № | Статус | Запланировано | Отправлено | Пост | Ошибка |',
              '|---:|---|---|---|---|---|',
              ...rows,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = 44;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
