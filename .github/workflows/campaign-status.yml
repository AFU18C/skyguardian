name: SkyGuardian Campaign Status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/campaign-status.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Process due campaign posts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /var/www/skyguardian
          sudo -u www-data php artisan skyguardian:group-channel-publications:process --limit=20
          sudo -u www-data php artisan skyguardian:promo-campaign:status

      - name: Publish campaign status to issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const promoPath = '/var/www/skyguardian/public/storage/skyguardian-campaign-status.json';
            const marker = '<!-- skyguardian-campaign-status -->';
            const redact = (value) => String(value ?? '')
              .replace(/https:\/\/api\.telegram\.org\/bot[^/\s]+/gi, 'https://api.telegram.org/bot[REDACTED]')
              .replace(/\b\d{6,15}:[A-Za-z0-9_-]{20,}\b/g, '[TELEGRAM_BOT_TOKEN_REDACTED]')
              .replaceAll('|', '\\|');

            if (!fs.existsSync(promoPath)) {
              core.setFailed(`Status file not found: ${promoPath}`);
              return;
            }

            const status = JSON.parse(fs.readFileSync(promoPath, 'utf8'));
            const rows = (status.posts || []).map((post) => {
              const link = post.post_link ? `[Відкрити](${post.post_link})` : '—';
              const error = post.last_error ? redact(post.last_error) : '—';
              return `| ${post.number ?? '—'} | ${post.status ?? '—'} | ${post.scheduled_at ?? '—'} | ${post.sent_at ?? '—'} | ${link} | ${error} |`;
            });

            const body = [
              marker,
              '## Статус кампании SkyGuardian',
              '',
              `Обновлено: ${status.generated_at ?? new Date().toISOString()}`,
              '',
              '### Первая промо-кампания',
              '',
              '| № | Статус | Запланировано | Отправлено | Пост | Ошибка |',
              '|---:|---|---|---|---|---|',
              ...rows,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = 44;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
