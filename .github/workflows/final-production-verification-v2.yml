name: Final production verification v2

on:
  push:
    branches:
      - deploy-diagnostics-20260801
    paths:
      - .github/workflows/final-production-verification-v2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify final deployed revision
        shell: bash
        run: |
          set -u
          RESULT="$GITHUB_WORKSPACE/final-production-verification-v2-result.txt"
          APP=/var/www/skyguardian
          DOMAIN=skyguardian.pp.ua
          START="$(date -u '+%Y-%m-%d %H:%M:%S')"
          : > "$RESULT"
          item() { printf '%s=%s\n' "$1" "$2" >> "$RESULT"; }

          MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          DEPLOYED="$(git ls-remote origin refs/tags/deployed | awk '{print $1}')"
          item checked_started_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          item main_sha "$MAIN"
          item deployed_sha "$DEPLOYED"
          item deployment_match "$([ "$MAIN" = "$DEPLOYED" ] && echo yes || echo no)"
          item env_permissions "$(stat -c '%a %U:%G' "$APP/.env" 2>/dev/null || echo missing)"
          item storage_link "$([ -L "$APP/public/storage" ] && echo yes || echo no)"
          item storage_preserved_in_deploy "$(grep -q -- '--exclude="storage"' "$APP/deploy/deploy.sh" && grep -q -- '--exclude="public/storage"' "$APP/deploy/deploy.sh" && echo yes || echo no)"
          item package_lock "$([ -f "$APP/package-lock.json" ] && echo yes || echo no)"
          item daily_log_files "$(sudo find "$APP/storage/logs" -maxdepth 1 -type f -name 'laravel-*.log' -printf '%f,' 2>/dev/null | sed 's/,$//' || true)"
          item archived_log_files "$(sudo find "$APP/storage/logs/archive" -maxdepth 1 -type f -name '*.gz' -printf '%f,' 2>/dev/null | sed 's/,$//' || true)"
          item uploaded_media_files "$(sudo find "$APP/storage/app/public" -type f 2>/dev/null | wc -l)"

          for unit in nginx.service mysql.service php8.3-fpm.service skyguardian-telethon.service skyguardian-scheduler.service skyguardian-group-channel-telethon.service skyguardian-group-channel-delete.service skyguardian-backup.timer; do
            key="$(printf '%s' "$unit" | tr '.-' '__')"
            item "unit_${key}_active" "$(systemctl is-active "$unit" 2>/dev/null || echo missing)"
            item "unit_${key}_enabled" "$(systemctl is-enabled "$unit" 2>/dev/null || echo missing)"
          done

          cd "$APP"
          item artisan_about_status "$(sudo -u www-data php artisan about --no-ansi >/dev/null 2>&1; echo $?)"
          item schedule_list_status "$(sudo -u www-data php artisan schedule:list --no-ansi >/dev/null 2>&1; echo $?)"
          item pending_migrations "$(sudo -u www-data php artisan migrate:status --no-ansi 2>/dev/null | grep -c Pending || true)"
          item manual_sources_command_status "$(sudo -u www-data php artisan skyguardian:sources:process --limit=40 >/dev/null 2>&1; echo $?)"

          sudo -u www-data php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            echo "runtime_env=".app()->environment().PHP_EOL;
            echo "runtime_debug=".(config("app.debug")?"yes":"no").PHP_EOL;
            echo "runtime_db=".config("database.default").PHP_EOL;
            echo "runtime_cache=".config("cache.default").PHP_EOL;
            foreach (["news","air_alert"] as $type) {
                $sources=App\Models\Source::query()->where("type",$type)->where("is_active",true)->with("technicalAccount")->get();
                $latest=$sources->max("last_success_at");
                echo "before_{$type}_active=".$sources->count().PHP_EOL;
                echo "before_{$type}_latest_success=".($latest?:"none").PHP_EOL;
                echo "before_{$type}_success_age_seconds=".($latest?now()->diffInSeconds($latest):999999).PHP_EOL;
                echo "before_{$type}_errors=".$sources->filter(fn($s)=>filled($s->last_error))->count().PHP_EOL;
                echo "before_{$type}_connected_accounts=".$sources->filter(fn($s)=>$s->technicalAccount && $s->technicalAccount->is_active && $s->technicalAccount->status==="connected")->count().PHP_EOL;
            }
          ' >> "$RESULT" 2>&1

          sleep 75

          sudo -u www-data php -r '
            require "vendor/autoload.php";
            $app=require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            foreach (["news","air_alert"] as $type) {
                $sources=App\Models\Source::query()->where("type",$type)->where("is_active",true)->get();
                $latest=$sources->max("last_success_at");
                echo "after_{$type}_latest_success=".($latest?:"none").PHP_EOL;
                echo "after_{$type}_success_age_seconds=".($latest?now()->diffInSeconds($latest):999999).PHP_EOL;
                echo "after_{$type}_errors=".$sources->filter(fn($s)=>filled($s->last_error))->count().PHP_EOL;
            }
          ' >> "$RESULT" 2>&1

          item relayed_errors_during_check "$(sudo journalctl -u skyguardian-scheduler.service --since "$START" --no-pager -q 2>/dev/null | grep -c messages_relayed || true)"
          item scheduler_failures_during_check "$(sudo journalctl -u skyguardian-scheduler.service --since "$START" --no-pager -q 2>/dev/null | grep -c 'failed with exit code' || true)"
          item scheduler_done_during_check "$(sudo journalctl -u skyguardian-scheduler.service --since "$START" --no-pager -q 2>/dev/null | grep -c 'skyguardian:sources:process.*DONE' || true)"

          HEADERS="$(mktemp)"
          item home_status "$(curl -sS -o /dev/null -D "$HEADERS" -w '%{http_code}' "https://$DOMAIN/")"
          item login_status "$(curl -sS -o /dev/null -w '%{http_code}' "https://$DOMAIN/admin/login")"
          item health_status "$(curl -sS -o /dev/null -w '%{http_code}' "https://$DOMAIN/up")"
          item not_found_status "$(curl -sS -o /dev/null -w '%{http_code}' "https://$DOMAIN/verification-missing-page")"
          for header in strict-transport-security content-security-policy x-frame-options x-content-type-options referrer-policy permissions-policy; do
            value="$(awk -v h="$header" 'BEGIN{IGNORECASE=1} $0 ~ "^"h":" {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$HEADERS")"
            item "header_$(printf '%s' "$header" | tr '-' '_')" "${value:-missing}"
          done
          rm -f "$HEADERS"

          NEWEST="$(sudo find /var/backups/skyguardian -maxdepth 1 -type f -name 'skyguardian-full-*.tar.gz' -printf '%T@|%p\n' 2>/dev/null | sort -nr | head -1 | cut -d'|' -f2-)"
          item backup_count "$(sudo find /var/backups/skyguardian -maxdepth 1 -type f -name 'skyguardian-full-*.tar.gz' | wc -l)"
          item newest_backup "$NEWEST"
          item newest_backup_permissions "$(sudo stat -c '%a %U:%G' "$NEWEST" 2>/dev/null || echo missing)"
          item newest_backup_test "$(sudo tar -tzf "$NEWEST" >/dev/null 2>&1 && echo passed || echo failed)"
          item newest_backup_sha256 "$(sudo sha256sum "$NEWEST" 2>/dev/null | awk '{print $1}')"

          CRITICAL_OK=yes
          [ "$MAIN" = "$DEPLOYED" ] || CRITICAL_OK=no
          [ "$(curl -sS -o /dev/null -w '%{http_code}' "https://$DOMAIN/")" = 200 ] || CRITICAL_OK=no
          [ "$(curl -sS -o /dev/null -w '%{http_code}' "https://$DOMAIN/admin/login")" = 200 ] || CRITICAL_OK=no
          [ "$(systemctl is-active skyguardian-scheduler.service)" = active ] || CRITICAL_OK=no
          [ "$(systemctl is-active skyguardian-telethon.service)" = active ] || CRITICAL_OK=no
          [ "$(sudo tar -tzf "$NEWEST" >/dev/null 2>&1; echo $?)" = 0 ] || CRITICAL_OK=no
          item final_status "$CRITICAL_OK"
          item checked_finished_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Commit result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-production-verification-v2-result.txt
          git commit -m "Record final production verification v2" || exit 0
          git push origin HEAD:deploy-diagnostics-20260801
