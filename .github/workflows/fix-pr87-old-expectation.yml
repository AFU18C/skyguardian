name: Fix PR87 Old Expectation

on:
  push:
    branches:
      - fix/keep-last-alert-card-on-clear

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/keep-last-alert-card-on-clear
          fetch-depth: 0
      - name: Update old test expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/Feature/GroupChannelAlertPublicationTest.php')
          text = path.read_text()
          old = """        Http::assertSent(function (Request $request): bool {\n            return str_ends_with($request->url(), '/deleteMessage')\n                && (int) $request['message_id'] === 101;\n        });\n"""
          new = """        Http::assertNotSent(function (Request $request): bool {\n            return str_ends_with($request->url(), '/deleteMessage')\n                && (int) $request['message_id'] === 101;\n        });\n"""
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Feature/GroupChannelAlertPublicationTest.php
          git commit -m "Обновить тест полного отбоя без удаления карточки"
          git push origin HEAD:fix/keep-last-alert-card-on-clear
