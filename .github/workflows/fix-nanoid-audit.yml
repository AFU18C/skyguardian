name: Fix Nanoid Audit

on:
  push:
    branches:
      - fix/alert-history-deep-link

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/alert-history-deep-link
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm audit fix --package-lock-only
      - run: npm audit --audit-level=high
      - name: Commit lockfile fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Обновить nanoid для прохождения security audit"
          git push origin HEAD:fix/alert-history-deep-link
