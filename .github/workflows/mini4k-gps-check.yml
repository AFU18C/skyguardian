name: Build Mini4K GPS Check APK
on:
  push:
    branches: [ mini4k-gps-check ]
    paths:
      - 'mini4k-gps-check-source.zip'
      - '.github/workflows/mini4k-gps-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack source
        run: unzip -q -o mini4k-gps-check-source.zip
      - name: Build debug APK
        run: gradle -p mini4k-gps-check assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mini4k-gps-check-apk
          path: mini4k-gps-check/app/build/outputs/apk/debug/app-debug.apk
