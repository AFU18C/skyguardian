name: Apply Grouped Alert Formatting

on:
  push:
    branches:
      - ops/diagnose-alert-publications

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/grouped-alert-messages
          fetch-depth: 0

      - name: Patch alert publication and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          service_path = Path('app/Services/GroupChannelAlertPublicationService.php')
          service = service_path.read_text()

          old_group = """        foreach ($events->groupBy(fn (GroupChannelAlertEvent $event): string => implode('|', [
            $event->kind,
            $event->alert_type,
            $event->event_at->timezone('Europe/Kyiv')->format('Y-m-d H:i'),
            hash('sha256', trim((string) $event->details)),
        ])) as $batch) {
"""
          new_group = """        foreach ($events->groupBy(fn (GroupChannelAlertEvent $event): string => implode('|', [
            $event->kind,
            $event->alert_type,
            $event->event_at->timezone('Europe/Kyiv')->format('Y-m-d H:i'),
        ])) as $batch) {
"""
          if old_group not in service:
              raise SystemExit('grouping block not found')
          service = service.replace(old_group, new_group, 1)

          old_payload = """                    'chat_id' => $bot->chat_id,
                    'text' => $this->renderMessage($bot, $batch),
                    'disable_notification' => (bool) $bot->moduleSetting(
"""
          new_payload = """                    'chat_id' => $bot->chat_id,
                    'text' => $this->renderMessage($bot, $batch),
                    'parse_mode' => 'HTML',
                    'disable_notification' => (bool) $bot->moduleSetting(
"""
          if old_payload not in service:
              raise SystemExit('telegram payload block not found')
          service = service.replace(old_payload, new_payload, 1)

          pattern = re.compile(
              r"    /\*\*\n     \* @param  Collection<int, GroupChannelAlertEvent>  \$events\n     \*/\n"
              r"    private function renderMessage\(GroupChannelBot \$bot, Collection \$events\): string\n"
              r"    \{.*?\n    \}\n\n"
              r"    private function stateKey",
              re.S,
          )
          replacement = """    /**
     * @param  Collection<int, GroupChannelAlertEvent>  $events
     */
    private function renderMessage(GroupChannelBot $bot, Collection $events): string
    {
        return GroupChannelAlertMessageFormatter::render($bot, $events);
    }

    private function stateKey"""
          service, count = pattern.subn(replacement, service, count=1)
          if count != 1:
              raise SystemExit('renderMessage method not found')
          service_path.write_text(service)

          publication_test_path = Path('tests/Feature/GroupChannelAlertPublicationTest.php')
          test = publication_test_path.read_text()
          old_count = """        $this->assertDatabaseCount('group_channel_alert_states', 4);
        Http::assertSent(function (Request $request): bool {
"""
          new_count = """        $this->assertDatabaseCount('group_channel_alert_states', 4);
        Http::assertSentCount(1);
        Http::assertSent(function (Request $request): bool {
"""
          if old_count not in test:
              raise SystemExit('publication test count marker not found')
          test = test.replace(old_count, new_count, 1)

          old_assertion = """            return str_contains($text, 'Харківська область — Берестинський район')
                && str_contains($text, '🎯 КАБИ → на північ Харківщини!')
                && str_contains($text, '🕒 Початок: 10:00');
"""
          new_assertion = """            return $request['parse_mode'] === 'HTML'
                && str_contains($text, '<b>🚨 ПОВІТРЯНА ТРИВОГА</b>')
                && str_contains($text, '📍 <b>Харківська область</b>')
                && str_contains($text, '• Берестинський район')
                && str_contains($text, '• м. Харків та тергромада')
                && str_contains($text, '• Лозівська міська громада')
                && substr_count($text, 'Харківська область') === 1
                && str_contains($text, '🎯 КАБИ → на північ Харківщини!')
                && str_contains($text, '🕒 Початок: <b>10:00</b>');
"""
          if old_assertion not in test:
              raise SystemExit('publication assertion not found')
          test = test.replace(old_assertion, new_assertion, 1)
          publication_test_path.write_text(test)

          mapping_test_path = Path('tests/Feature/GroupChannelAlertOblastMappingTest.php')
          mapping = mapping_test_path.read_text()
          old_city = """                return str_contains($request->url(), 'api.telegram.org')
                    && str_contains((string) $request['text'], 'Дніпропетровська область — м. Марганець');
"""
          new_city = """                $text = (string) $request['text'];

                return str_contains($request->url(), 'api.telegram.org')
                    && $request['parse_mode'] === 'HTML'
                    && str_contains($text, '<b>Дніпропетровська область</b>')
                    && str_contains($text, '• м. Марганець');
"""
          if old_city not in mapping:
              raise SystemExit('mapping city assertion not found')
          mapping = mapping.replace(old_city, new_city, 1)

          old_raion = """                return str_contains($request->url(), 'api.telegram.org')
                    && str_contains((string) $request['text'], 'Харківська область — Ізюмський район');
"""
          new_raion = """                $text = (string) $request['text'];

                return str_contains($request->url(), 'api.telegram.org')
                    && $request['parse_mode'] === 'HTML'
                    && str_contains($text, '<b>Харківська область</b>')
                    && str_contains($text, '• Ізюмський район');
"""
          if old_raion not in mapping:
              raise SystemExit('mapping raion assertion not found')
          mapping = mapping.replace(old_raion, new_raion, 1)
          mapping_test_path.write_text(mapping)
          PY

          rm -f .github/grouped-alert-format-trigger
          rm -f .github/workflows/apply-grouped-alert-format.yml

      - name: Commit to feature branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Apply grouped alert message formatting'
          git push origin HEAD:feature/grouped-alert-messages
