name: Verify Alert Publishing Fix

on:
  push:
    branches:
      - ops/diagnose-alert-publications

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Wait for production and verify publishing
        shell: bash
        run: |
          set -u
          exec > >(tee /tmp/skyguardian-alert-verification.txt) 2>&1
          cd /var/www/skyguardian

          echo '=== wait for deployed fix ==='
          deployed=0
          for attempt in $(seq 1 90); do
            if grep -q 'normalizeOblastUid' app/Services/AlertsInUaClient.php 2>/dev/null; then
              deployed=1
              echo "deployed_fix_detected_attempt=$attempt"
              break
            fi
            sleep 5
          done

          if [ "$deployed" -ne 1 ]; then
            echo 'deployed_fix_not_detected'
            exit 1
          fi

          cat > /tmp/skyguardian-alert-verify.php <<'PHP'
          <?php
          require '/var/www/skyguardian/vendor/autoload.php';
          $app = require '/var/www/skyguardian/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          foreach (App\Models\GroupChannelBot::query()->orderBy('id')->get() as $bot) {
              if (! $bot->moduleEnabled(App\Models\GroupChannelBot::MODULE_ALERT_PUBLICATIONS)) {
                  continue;
              }

              echo json_encode([
                  'bot_id' => $bot->id,
                  'group' => $bot->group_name,
                  'last_checked_at' => optional($bot->alerts_api_last_checked_at)?->toIso8601String(),
                  'last_success_at' => optional($bot->alerts_api_last_success_at)?->toIso8601String(),
                  'last_error' => $bot->alerts_api_last_error,
                  'states' => $bot->alertStates()->count(),
                  'pending' => $bot->alertEvents()->where('status', 'pending')->count(),
                  'sent' => $bot->alertEvents()->where('status', 'sent')->count(),
                  'errors' => $bot->alertEvents()->where('status', 'error')->count(),
              ], JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES).PHP_EOL;

              echo "latest_events:\n";
              foreach ($bot->alertEvents()->latest('id')->limit(20)->get()->reverse() as $event) {
                  echo json_encode([
                      'kind' => $event->kind,
                      'region' => $event->region_name,
                      'type' => $event->alert_type,
                      'status' => $event->status,
                      'event_at' => optional($event->event_at)?->toIso8601String(),
                      'sent_at' => optional($event->sent_at)?->toIso8601String(),
                      'last_error' => $event->last_error,
                  ], JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES).PHP_EOL;
              }
          }
          PHP

          echo '=== before forced cycle ==='
          sudo -u www-data php /tmp/skyguardian-alert-verify.php || true

          echo '=== forced cycle ==='
          set +e
          sudo -u www-data php artisan skyguardian:group-channel-alerts:process --limit=50
          cycle_status=$?
          set -e
          echo "cycle_exit_code=$cycle_status"

          sleep 3

          echo '=== after forced cycle ==='
          sudo -u www-data php /tmp/skyguardian-alert-verify.php || true

          rm -f /tmp/skyguardian-alert-verify.php
          exit "$cycle_status"

      - name: Publish verification report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/skyguardian-alert-verification.txt';
            let report = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Verification output was not created.';
            report = report
              .replace(/https:\/\/api\.telegram\.org\/bot[^/\s]+/gi, 'https://api.telegram.org/bot[REDACTED]')
              .replace(/\b\d{6,15}:[A-Za-z0-9_-]{20,}\b/g, '[TELEGRAM_BOT_TOKEN_REDACTED]')
              .slice(-55000);

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 60,
              body: `Автоматическая проверка production после исправления.\n\n\`\`\`text\n${report}\n\`\`\``,
            });
