name: Update CommonMark dependency

on:
  push:
    branches:
      - feature/separate-source-polling-settings
    paths:
      - .github/workflows/update-commonmark.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite
          coverage: none

      - name: Update league/commonmark only
        run: composer update league/commonmark --with-dependencies --minimal-changes --no-interaction --no-progress --no-scripts

      - name: Verify targeted update
        run: |
          git diff --exit-code -- composer.json
          composer show --locked league/commonmark | grep -E '^versions[[:space:]]*:.*2\.9\.0'

      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock already up to date"
            exit 0
          fi
          git commit -m "chore: update league/commonmark to 2.9.0"
          git push origin HEAD:${GITHUB_REF_NAME}
