name: Full site audit

on:
  push:
    branches:
      - full-site-audit-20260801
    paths:
      - .github/workflows/full-site-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect scheduler errors without changes
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/error-source-audit.txt"
          : > "$OUT"
          APP=/var/www/skyguardian
          echo "audit_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$OUT"
          echo "production_modified=no" >> "$OUT"
          echo >> "$OUT"
          echo "## messages_relayed references" >> "$OUT"
          sudo grep -RIn --exclude='*.log' --exclude-dir=vendor --exclude-dir=node_modules 'messages_relayed' "$APP/app" "$APP/routes" "$APP/telethon" 2>/dev/null >> "$OUT" || true
          echo >> "$OUT"
          echo "## command and scheduler references" >> "$OUT"
          sudo grep -RIn --exclude='*.log' --exclude-dir=vendor --exclude-dir=node_modules -E 'sources:process|ProcessSources|messages_relayed' "$APP/app" "$APP/routes" "$APP/telethon" 2>/dev/null >> "$OUT" || true
          echo >> "$OUT"
          echo "## latest sanitized stack for messages_relayed" >> "$OUT"
          LOG="$APP/storage/logs/laravel.log"
          LINE="$(sudo grep -n 'Undefined array key "messages_relayed"' "$LOG" 2>/dev/null | tail -1 | cut -d: -f1)"
          echo "log_line=${LINE:-not_found}" >> "$OUT"
          if [ -n "$LINE" ]; then
            END=$((LINE+35))
            sudo sed -n "${LINE},${END}p" "$LOG" \
              | sed -E 's/[A-Fa-f0-9]{24,}/[REDACTED]/g; s#https://t\.me/[^[:space:]]+#https://t.me/[REDACTED]#g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[EMAIL]/g; s/(token|secret|password|api_hash)[=:][^, }]+/\1=[REDACTED]/Ig' \
              >> "$OUT"
          fi
          echo >> "$OUT"
          echo "## deployment workflow permission commands" >> "$OUT"
          grep -nE 'chown|chmod|storage/logs|bootstrap/cache|storage/framework' "$GITHUB_WORKSPACE/.github/workflows/deploy.yml" >> "$OUT" 2>/dev/null || true
      - name: Commit error source report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add error-source-audit.txt
          git commit -m "Record scheduler error source audit" || exit 0
          git push origin HEAD:full-site-audit-20260801
