name: Apply SkyGuardian stabilization

on:
  push:
    branches:
      - full-site-audit-20260801
    paths:
      - .github/workflows/full-site-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize-full-site-20260801
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract prepared stabilization scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/apply-stability-fixes.yml').read_text())
          steps = workflow['jobs']['prepare']['steps']
          wanted = {
              'Apply code and deployment improvements': '/tmp/skyguardian-step-1.sh',
              'Generate lock files and validate': '/tmp/skyguardian-step-2.sh',
              'Record validation and commit': '/tmp/skyguardian-step-3.sh',
          }
          found = set()
          for step in steps:
              name = step.get('name')
              if name in wanted:
                  Path(wanted[name]).write_text('#!/usr/bin/env bash\n' + step['run'])
                  Path(wanted[name]).chmod(0o700)
                  found.add(name)
          missing = set(wanted) - found
          if missing:
              raise SystemExit(f'Missing prepared steps: {sorted(missing)}')
          PY

      - name: Apply prepared changes
        run: /tmp/skyguardian-step-1.sh

      - name: Generate locks and validate everything
        run: /tmp/skyguardian-step-2.sh

      - name: Commit validated stabilization branch
        run: /tmp/skyguardian-step-3.sh
