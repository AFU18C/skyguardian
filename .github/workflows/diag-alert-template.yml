name: Apply Alert Territory Times

on:
  push:
    branches:
      - feature/alert-territory-times

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/alert-territory-times
          fetch-depth: 0
      - name: Apply formatter changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          service_path = Path('app/Services/GroupChannelAlertPublicationService.php')
          service = service_path.read_text()

          render_message_start = service.index('    private function renderMessage(')
          render_message_end = service.index('    /**\n     * @param  Collection<int, GroupChannelAlertState>  $states\n     */\n    private function renderActiveCard', render_message_start)
          new_render_message = r'''    private function renderMessage(GroupChannelBot $bot, Collection $events): string
    {
        /** @var GroupChannelAlertEvent $first */
        $first = $events->first();
        $templateKey = $first->kind === GroupChannelAlertEvent::KIND_START
            ? 'start_template'
            : 'end_template';
        $default = $first->kind === GroupChannelAlertEvent::KIND_START
            ? GroupChannelBot::DEFAULT_ALERT_START_TEMPLATE
            : GroupChannelBot::DEFAULT_ALERT_END_TEMPLATE;
        $template = trim((string) $bot->moduleSetting(
            GroupChannelBot::MODULE_ALERT_PUBLICATIONS,
            $templateKey,
            $default,
        ));

        if ($template === '') {
            $template = $default;
        }

        if ($first->kind === GroupChannelAlertEvent::KIND_START
            && $this->normalizeTemplate($template) === $this->normalizeTemplate(GroupChannelBot::LEGACY_ALERT_START_TEMPLATE)) {
            $template = GroupChannelBot::DEFAULT_ALERT_START_TEMPLATE;
        }

        $regions = $events
            ->pluck('region_name')
            ->filter()
            ->unique()
            ->sort()
            ->values()
            ->implode("\n📍 ");
        $details = $events
            ->pluck('details')
            ->filter()
            ->unique()
            ->values()
            ->implode("\n🎯 ");
        $oblast = $this->scopeName($first->scope_region_uid, $first->region_name);
        $territories = $events
            ->sortBy(fn (GroupChannelAlertEvent $event): string => $this->territoryLabel($event->region_name, $oblast))
            ->map(fn (GroupChannelAlertEvent $event): string => '› '
                .$this->territoryLabel($event->region_name, $oblast)
                .' — '.$event->event_at->timezone('Europe/Kyiv')->format('H:i'))
            ->unique()
            ->values()
            ->implode("\n");
        $hasDetailsVariable = str_contains($template, '{details}');
        $message = strtr($template, [
            '{region}' => $regions,
            '{time}' => $first->event_at->timezone('Europe/Kyiv')->format('H:i'),
            '{threat_type}' => GroupChannelBot::ALERT_TYPES[$first->alert_type] ?? $first->alert_type,
            '{details}' => $details,
            '{headline}' => $this->alertHeadline($first->alert_type),
            '{oblast}' => $oblast,
            '{territories}' => $territories,
            '{updated}' => $first->event_at->timezone('Europe/Kyiv')->format('H:i'),
        ]);

        if ($first->kind === GroupChannelAlertEvent::KIND_START
            && $details !== ''
            && ! $hasDetailsVariable) {
            $detailsLine = "🎯 {$details}";
            $message = str_contains($message, "\n🔄")
                ? str_replace("\n🔄", "\n\n{$detailsLine}\n\n🔄", $message)
                : $message."\n{$detailsLine}";
        }

        return $this->finishMessage($message);
    }

'''
          service = service[:render_message_start] + new_render_message + service[render_message_end:]

          active_start = service.index('    private function renderActiveCard(')
          active_end = service.index('    /**\n     * @param  Collection<int, GroupChannelAlertState>  $states\n     */\n    private function activeSnapshotHash', active_start)
          new_active = r'''    private function renderActiveCard(
        GroupChannelBot $bot,
        Collection $states,
        CarbonImmutable $startedAt,
        CarbonImmutable $updatedAt,
        bool $isRefresh,
    ): string {
        /** @var GroupChannelAlertState $first */
        $first = $states->first();
        $template = trim((string) $bot->moduleSetting(
            GroupChannelBot::MODULE_ALERT_PUBLICATIONS,
            'start_template',
            GroupChannelBot::DEFAULT_ALERT_START_TEMPLATE,
        ));

        if ($template === '') {
            $template = GroupChannelBot::DEFAULT_ALERT_START_TEMPLATE;
        }

        if ($this->normalizeTemplate($template) === $this->normalizeTemplate(GroupChannelBot::LEGACY_ALERT_START_TEMPLATE)) {
            $template = GroupChannelBot::DEFAULT_ALERT_START_TEMPLATE;
        }

        $oblast = $this->scopeName($first->scope_region_uid, $first->region_name);
        $regions = $states
            ->pluck('region_name')
            ->filter()
            ->unique()
            ->sort()
            ->values()
            ->implode("\n📍 ");
        $territories = $states
            ->sortBy(fn (GroupChannelAlertState $state): string => $this->territoryLabel($state->region_name, $oblast))
            ->map(function (GroupChannelAlertState $state) use ($oblast, $startedAt): string {
                $time = $state->started_at?->timezone('Europe/Kyiv')->format('H:i')
                    ?? $startedAt->timezone('Europe/Kyiv')->format('H:i');

                return '› '.$this->territoryLabel($state->region_name, $oblast).' — '.$time;
            })
            ->unique()
            ->values()
            ->implode("\n");
        $details = $states
            ->pluck('details')
            ->filter()
            ->unique()
            ->values()
            ->implode("\n🎯 ");
        $hasDetailsVariable = str_contains($template, '{details}');
        $hasUpdatedVariable = str_contains($template, '{updated}');
        $message = strtr($template, [
            '{region}' => $regions,
            '{time}' => $startedAt->timezone('Europe/Kyiv')->format('H:i'),
            '{threat_type}' => GroupChannelBot::ALERT_TYPES[$first->alert_type] ?? $first->alert_type,
            '{details}' => $details,
            '{headline}' => $this->alertHeadline($first->alert_type),
            '{oblast}' => $oblast,
            '{territories}' => $territories,
            '{updated}' => $updatedAt->timezone('Europe/Kyiv')->format('H:i'),
        ]);

        if ($details !== '' && ! $hasDetailsVariable) {
            $detailsLine = "🎯 {$details}";
            $message = str_contains($message, "\n🔄")
                ? str_replace("\n🔄", "\n\n{$detailsLine}\n\n🔄", $message)
                : $message."\n{$detailsLine}";
        }

        if ($isRefresh && ! $hasUpdatedVariable) {
            $message .= "\n🔄 Оновлено: ".$updatedAt->timezone('Europe/Kyiv')->format('H:i');
        }

        return $this->finishMessage($message);
    }

    private function alertHeadline(string $alertType): string
    {
        return mb_strtoupper(GroupChannelBot::ALERT_TYPES[$alertType] ?? $alertType);
    }

    private function scopeName(?string $scopeRegionUid, string $regionName): string
    {
        if ($scopeRegionUid !== null && isset(GroupChannelBot::ALERT_REGIONS[$scopeRegionUid])) {
            return GroupChannelBot::ALERT_REGIONS[$scopeRegionUid];
        }

        return trim(explode(' — ', $regionName)[0] ?? $regionName);
    }

    private function territoryLabel(string $regionName, string $oblast): string
    {
        $regionName = trim($regionName);

        if ($regionName === '' || $regionName === $oblast) {
            return $regionName !== '' ? $regionName : 'Невідома локація';
        }

        $parts = array_values(array_filter(
            array_map('trim', explode(' — ', $regionName)),
            fn (string $part): bool => $part !== '',
        ));

        return $parts !== [] ? (string) end($parts) : $regionName;
    }

    private function normalizeTemplate(string $template): string
    {
        return str_replace(["\r\n", "\r"], "\n", trim($template));
    }

'''
          service = service[:active_start] + new_active + service[active_end:]
          service_path.write_text(service)

          bot_path = Path('app/Models/GroupChannelBot.php')
          bot = bot_path.read_text()
          old_const = '    public const DEFAULT_ALERT_START_TEMPLATE = "🚨 ПОВІТРЯНА ТРИВОГА\\n\\n📍 {region}\\n⚠️ {threat_type}\\n🕒 Початок: {time}";'
          new_const = '''    public const LEGACY_ALERT_START_TEMPLATE = "🚨 ПОВІТРЯНА ТРИВОГА\\n\\n📍 {region}\\n⚠️ {threat_type}\\n🕒 Початок: {time}";\n\n    public const DEFAULT_ALERT_START_TEMPLATE = "🚨 {headline}\\n\\n📍 {oblast}\\n\\n🔴 СТАТУС: АКТИВНА\\n{territories}\\n\\n🔄 Оновлено: {updated}";'''
          if old_const not in bot:
              raise SystemExit('DEFAULT_ALERT_START_TEMPLATE marker not found')
          bot_path.write_text(bot.replace(old_const, new_const, 1))

          test_path = Path('tests/Feature/GroupChannelAlertPublicationTest.php')
          test = test_path.read_text()
          test = test.replace("&& str_contains((string) $request['text'], 'Повітряна тривога');", "&& str_contains((string) $request['text'], 'ПОВІТРЯНА ТРИВОГА');", 1)
          old_assert = """            return str_ends_with($request->url(), '/sendMessage')\n                && str_contains($text, 'Харківська область — Берестинський район')\n                && str_contains($text, '🎯 КАБИ → на північ Харківщини!')\n                && str_contains($text, '🕒 Початок: 10:00');"""
          new_assert = """            return str_ends_with($request->url(), '/sendMessage')\n                && str_contains($text, '📍 Харківська область')\n                && str_contains($text, '› Берестинський район — 10:00')\n                && str_contains($text, '🎯 КАБИ → на північ Харківщини!')\n                && ! str_contains($text, 'Активні території')\n                && ! str_contains($text, '🕒 Початок:');"""
          if old_assert not in test:
              raise SystemExit('existing supported-location assertion not found')
          test = test.replace(old_assert, new_assert, 1)

          insert_marker = '    public function test_selected_oblasts_include_all_their_locations_and_respect_threat_types(): void\n'
          new_test = r'''    public function test_active_card_shows_scope_and_individual_start_time_for_each_territory(): void
    {
        Http::fake([
            'https://api.telegram.org/*' => Http::response([
                'ok' => true,
                'result' => ['message_id' => 777],
            ]),
        ]);

        $bot = $this->alertBot();
        $service = app(GroupChannelAlertPublicationService::class);
        $service->processSnapshot($bot, []);

        $service->processSnapshot($bot->fresh(), [
            $this->alert(1201, 'Бердянський район', 'raion', 7001, 'air_raid', 12, null, null, '2026-08-07T19:52:00+03:00'),
            $this->alert(1202, 'м. Запоріжжя', 'city', 7002, 'air_raid', 12, null, null, '2026-08-07T19:57:00+03:00'),
        ]);

        Http::assertSent(function (Request $request): bool {
            $text = (string) ($request['text'] ?? '');

            return str_ends_with($request->url(), '/sendMessage')
                && str_contains($text, '🚨 ПОВІТРЯНА ТРИВОГА')
                && str_contains($text, '📍 Запорізька область')
                && str_contains($text, '🔴 СТАТУС: АКТИВНА')
                && str_contains($text, '› Бердянський район — 19:52')
                && str_contains($text, '› м. Запоріжжя — 19:57')
                && str_contains($text, '🔄 Оновлено:')
                && ! str_contains($text, 'Активні території')
                && ! str_contains($text, '🕒 Початок:');
        });
    }

'''
          if insert_marker not in test:
              raise SystemExit('test insertion marker not found')
          test = test.replace(insert_marker, new_test + insert_marker, 1)

          sig_old = """        ?int $oblastUid = null,\n        ?string $raion = null,\n        ?string $notes = null,\n    ): array {"""
          sig_new = """        ?int $oblastUid = null,\n        ?string $raion = null,\n        ?string $notes = null,\n        ?string $startedAt = null,\n    ): array {"""
          if sig_old not in test:
              raise SystemExit('alert helper signature marker not found')
          test = test.replace(sig_old, sig_new, 1)
          test = test.replace("            'started_at' => '2026-08-04T10:00:00+03:00',", "            'started_at' => $startedAt ?? '2026-08-04T10:00:00+03:00',", 1)
          test_path.write_text(test)

          migration = Path('database/migrations/2026_08_07_181000_update_default_alert_start_template.php')
          migration.write_text(r'''<?php

use Illuminate\Database\Migrations\Migration;
use Illuminate\Support\Facades\DB;

return new class extends Migration
{
    private const LEGACY = "🚨 ПОВІТРЯНА ТРИВОГА\n\n📍 {region}\n⚠️ {threat_type}\n🕒 Початок: {time}";

    private const CURRENT = "🚨 {headline}\n\n📍 {oblast}\n\n🔴 СТАТУС: АКТИВНА\n{territories}\n\n🔄 Оновлено: {updated}";

    public function up(): void
    {
        $this->replaceTemplate(self::LEGACY, self::CURRENT);
    }

    public function down(): void
    {
        $this->replaceTemplate(self::CURRENT, self::LEGACY);
    }

    private function replaceTemplate(string $from, string $to): void
    {
        DB::table('group_channel_bots')
            ->select(['id', 'module_settings'])
            ->orderBy('id')
            ->chunkById(100, function ($bots) use ($from, $to): void {
                foreach ($bots as $bot) {
                    $settings = json_decode((string) $bot->module_settings, true);

                    if (! is_array($settings)) {
                        continue;
                    }

                    $current = data_get($settings, 'alert_publications.start_template');

                    if (! is_string($current)
                        || $this->normalize($current) !== $this->normalize($from)) {
                        continue;
                    }

                    data_set($settings, 'alert_publications.start_template', $to);

                    DB::table('group_channel_bots')
                        ->where('id', $bot->id)
                        ->update([
                            'module_settings' => json_encode(
                                $settings,
                                JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES,
                            ),
                        ]);
                }
            });
    }

    private function normalize(string $template): string
    {
        return str_replace(["\r\n", "\r"], "\n", trim($template));
    }
};
''')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Services/GroupChannelAlertPublicationService.php app/Models/GroupChannelBot.php tests/Feature/GroupChannelAlertPublicationTest.php database/migrations/2026_08_07_181000_update_default_alert_start_template.php
          git commit -m 'Показывать время начала для каждой территории тревоги'
          git push origin HEAD:feature/alert-territory-times
