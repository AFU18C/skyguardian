name: Apply Alert Territory Times

on:
  push:
    branches:
      - feature/alert-territory-times

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/alert-territory-times
          fetch-depth: 0
      - name: Apply formatter changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/apply_alert_format.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Services/GroupChannelAlertPublicationService.php app/Models/GroupChannelBot.php tests/Feature/GroupChannelAlertPublicationTest.php database/migrations/2026_08_07_181000_update_default_alert_start_template.php
          git commit -m 'Показывать время начала для каждой территории тревоги'
          git push origin HEAD:feature/alert-territory-times
