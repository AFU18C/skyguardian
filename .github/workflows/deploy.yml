name: Deploy SkyGuardian

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      BEFORE_SHA: ${{ github.event.before }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy Laravel application
        shell: bash
        run: bash deploy/deploy.sh

      - name: Mark deployed revision
        shell: bash
        run: |
          git tag -f deployed "$GITHUB_SHA"
          git push origin refs/tags/deployed --force
