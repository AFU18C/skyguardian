name: Deploy SkyGuardian

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      BEFORE_SHA: ${{ github.event.before }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy Laravel application
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo mkdir -p /var/www/skyguardian

          sudo rsync -a --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude=".venv" \
            --exclude="node_modules" \
            --exclude="vendor" \
            "$GITHUB_WORKSPACE/" /var/www/skyguardian/

          cd /var/www/skyguardian

          sudo mkdir -p \
            storage/framework/cache \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs \
            bootstrap/cache

          sudo chown -R github-runner:www-data /var/www/skyguardian
          sudo chmod -R ug+rwX storage bootstrap/cache
          sudo touch storage/logs/laravel.log
          sudo chown github-runner:www-data storage/logs/laravel.log
          sudo chmod 664 storage/logs/laravel.log

          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          .venv/bin/pip install --disable-pip-version-check -r telethon/requirements.txt

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          npm run build

          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          if ! grep -Eq '^APP_KEY=base64:.+' .env; then
            php artisan key:generate --force
          fi

          php artisan optimize:clear
          php artisan migrate --force
          php artisan config:cache
          php artisan view:cache

          sudo cp deploy/systemd/skyguardian-telethon.service /etc/systemd/system/skyguardian-telethon.service
          sudo cp deploy/systemd/skyguardian-scheduler.service /etc/systemd/system/skyguardian-scheduler.service
          sudo cp deploy/systemd/skyguardian-group-channel-telethon.service /etc/systemd/system/skyguardian-group-channel-telethon.service
          sudo cp deploy/systemd/skyguardian-group-channel-delete.service /etc/systemd/system/skyguardian-group-channel-delete.service
          sudo systemctl daemon-reload
          sudo systemctl enable \
            skyguardian-telethon.service \
            skyguardian-scheduler.service \
            skyguardian-group-channel-telethon.service \
            skyguardian-group-channel-delete.service

          CORE_RESTART_REQUIRED=1
          if [ -n "${BEFORE_SHA:-}" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git -C "$GITHUB_WORKSPACE" cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            CHANGED_FILES="$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            if [ -n "$CHANGED_FILES" ] \
              && ! printf '%s\n' "$CHANGED_FILES" | grep -Ev '^(database/migrations/2026_07_27_120000_create_group_channel_technical_delete_tasks_table\.php|\.github/workflows/deploy\.yml)$' >/dev/null; then
              CORE_RESTART_REQUIRED=0
            fi
          fi

          if [ "$CORE_RESTART_REQUIRED" -eq 1 ]; then
            sudo systemctl restart skyguardian-telethon.service skyguardian-scheduler.service
          else
            sudo systemctl is-active --quiet skyguardian-telethon.service || sudo systemctl start skyguardian-telethon.service
            sudo systemctl is-active --quiet skyguardian-scheduler.service || sudo systemctl start skyguardian-scheduler.service
          fi

          sudo systemctl restart \
            skyguardian-group-channel-telethon.service \
            skyguardian-group-channel-delete.service

          sudo chown -R www-data:www-data storage bootstrap/cache
          sudo chmod -R ug+rwX storage bootstrap/cache

          sudo systemctl reload php8.3-fpm
          sudo nginx -t
          sudo systemctl reload nginx

          sudo systemctl --no-pager --full status \
            skyguardian-telethon.service \
            skyguardian-scheduler.service \
            skyguardian-group-channel-telethon.service \
            skyguardian-group-channel-delete.service
          echo "SkyGuardian deployed successfully."

      - name: Mark deployed revision
        shell: bash
        run: |
          git tag -f deployed "$GITHUB_SHA"
          git push origin refs/tags/deployed --force
